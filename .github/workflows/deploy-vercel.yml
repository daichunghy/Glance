name: deploy-vercel

on:
  push:
    branches: [main]
    paths:
      - 'landing-page/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel configuration
        id: check
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "mode=hook" >> "$GITHUB_OUTPUT"
          elif [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "mode=cli" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets not configured yet. Add VERCEL_DEPLOY_HOOK or (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) in repository Actions secrets."
          fi

      - name: Trigger Vercel Deploy Hook
        if: steps.check.outputs.mode == 'hook'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Checkout repository
        if: steps.check.outputs.mode == 'cli'
        uses: actions/checkout@v4

      - name: Deploy landing-page via Vercel CLI
        if: steps.check.outputs.mode == 'cli'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          cd landing-page
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
