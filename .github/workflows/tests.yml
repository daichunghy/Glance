name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install step: both suites import only the standard library
      # and the local guard.py / posture.py modules. test_screen_cover.py
      # reads glance_windows.py through ast without executing it, so
      # OpenCV and PyQt6 are not needed to run the tests.
      - name: Windows test suite
        working-directory: windows
        run: python -m unittest discover -s tests

      - name: Linux test suite
        working-directory: linux
        run: python -m unittest discover -s tests
