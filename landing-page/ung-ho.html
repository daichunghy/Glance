<head>

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ủng hộ phát triển Glance ☕ — Screen Privacy App">

  <!-- Structured Data: BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Trang chủ",
        "item": "https://glance-privacy.vercel.app/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Ủng hộ dự án",
        "item": "https://glance-privacy.vercel.app/ung-ho.html"
      }
    ]
  }
  </script>

  <!-- Reference Fonts -->
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium">
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg">

  <link rel="stylesheet" href="donation.css?v=6">
</head>
<body class="mainframe-layout">

  <!-- INTERACTIVE BACKGROUND VIDEO (Flipped to Left, Color-graded to Glance Obsidian Blue) -->
  <div class="video-container" aria-hidden="true">
    <video
      id="scrub-video"
      class="bg-video"
      muted
      playsinline
      preload="auto"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4"
    ></video>
    <!-- Color grading & gradient overlay: fades to dark on right side for text legibility -->
    <div class="video-overlay"></div>
  </div>

  <!-- FIXED NAVBAR -->
  <header class="navbar">
    <a class="nav-brand" href="./">
      <img src="assets/product/glance-icon.png" width="28" height="28" alt="Glance">
      <span class="brand-text">Glance®</span>
      <span class="brand-asterisk">✳︎</span>
    </a>
    <div class="nav-right">
      <a class="nav-link" href="./#download">Về trang Glance</a>
    </div>
  </header>

  <!-- MAIN HERO: CONTENT ON THE RIGHT -->
  <main class="hero-wrapper">
    <!-- Notice for ongoing automatic download -->
    <div class="download-notice" id="download-notice" hidden>
      <span class="pulse-dot"></span>
      <span id="download-message">Bản cài đặt Glance đang được tải xuống...</span>
      <a id="manual-download" download class="retry-link">Tải lại</a>
    </div>

    <div class="hero-content">
      <!-- 1. Blurred intro label -->
      <div class="blurred-intro" aria-hidden="true">
        Anh/Chị dùng Glance thấy hay,<br>
        Ủng hộ em ly cà phê tiếp sức nhé ☕
      </div>

      <!-- 2. Typewriter Text -->
      <div class="typewriter-container">
        <p class="typewriter-text" id="typewriter-text"></p>
      </div>

      <!-- 3. Interactive Action / Donation Pills Form -->
      <form class="support-form" id="support-form">
        <div class="pills-container" id="pills-container">
          <label class="pill-btn">
            <input type="radio" name="preset" value="10000" data-note="Một ly trà đá sẻ chia. Cảm ơn bạn!">
            <span class="pill-content">🍵 10.000đ</span>
          </label>

          <label class="pill-btn is-active">
            <input type="radio" name="preset" value="20000" checked data-note="Một ly cà phê sáng tiếp sức coder. Rất biết ơn bạn!">
            <span class="pill-content">☕ 20.000đ (Ly cà phê)</span>
          </label>

          <label class="pill-btn">
            <input type="radio" name="preset" value="50000" data-note="Cà phê + Bánh mì nạp năng lượng cả ngày. Tuyệt vời!">
            <span class="pill-content">🥐 50.000đ</span>
          </label>

          <label class="pill-btn">
            <input type="radio" name="preset" value="100000" data-note="Sự đồng hành quý báu giúp Glance phát triển dài lâu. Trân trọng!">
            <span class="pill-content">🚀 100.000đ</span>
          </label>
        </div>

        <!-- Dynamic Note Box -->
        <p class="dynamic-note" id="preset-note">
          Một ly cà phê sáng tiếp sức coder. Rất biết ơn bạn! ☕💙
        </p>

        <!-- Custom Amount + CTA in Sleek Row -->
        <div class="action-row">
          <div class="custom-amount-pill">
            <input id="support-amount" name="amount" type="number" inputmode="numeric" min="1000" max="100000000" step="1000" value="20000" required placeholder="Số khác">
            <span class="unit">VNĐ</span>
          </div>

          <button class="submit-pill-btn" type="submit" id="submit-btn">
            <span class="btn-text">Ủng hộ qua PayOS ☕</span>
          </button>
        </div>

        <p class="status-msg" id="support-status" role="status" aria-live="polite"></p>

        <!-- Skip Link -->
        <div class="footer-links">
          <a class="skip-link" href="./#download">Dùng Glance miễn phí →</a>
        </div>
      </form>
    </div>
  </main>

  <script src="donation.js?v=6" defer></script>
</body>
</html>
